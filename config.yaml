DB_USERNAME: # 数据库账户
DB_PASSWORD: # 数据库密码
DB_ADDRESS: # 数据库地址
DB_PORT: 3306 # 数据库端口
DB_FUND: # 回测标的清单库名（仅含 tbl_funds_for_backtest），如 db_fund
DB_NETVALUE: # 存放爬取净值的库名，如 db_netvalue
DB_BACKTEST: # 存放回测数据的库名，如 db_backtest
DB_ETF: # 存放ETF日线行情的库名，如 db_etf

EXPORT_AIP_PLOT_PATH: # 导出回测分析图的路径

